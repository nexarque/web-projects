<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Table</title>
    <style>
        table {
            border: 2px solid black;
            width: 60%;
        }

        th {
            background-color: orange;
            padding: 10px;
        }

        td {
            border: 1px solid gray;
            text-align: center;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h2>Student Marks Table</h2>
    <table>
        <tr>
            <th>
                Name
            </th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>
                Swapnil
            </td>
            <td>Mathematics</td>
            <td>
                75
            </td>
            <tr>
                <td>Kavya</td>
                <td>Science</td>
                <td>35</td>
            </tr>
        </tr>
    </table>
</body>
</html>
