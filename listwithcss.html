<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=">
    <title>Styled list</title>
    <style>
        ul {
            list-style-type: circle;
            color: purple;
        }
        ol {
            list-style-type: lower-alpha;
            color: blue;
        }
    </style>
</head>
<body>
    <h3>Unordered List </h3>
    <ul>
        <li>Coffee</li>
        <li>Tea</li>
        <li>Juice</li>
    </ul>
    <ol>
        Ordered List
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>
</body>
</html>
